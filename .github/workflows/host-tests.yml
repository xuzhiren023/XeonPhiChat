name: Host tests
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hardware-free PowerShell 5.1 tests
        shell: powershell
        run: .\tools\Test-Host.ps1
      - name: Build source-only distribution
        shell: powershell
        run: .\tools\Build-Release.ps1 -SourceOnly
